<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>GoRent Approvals</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Approvals">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a; color: #e2e8f0; min-height: 100vh; padding-bottom: 40px;
  }
  header {
    position: sticky; top: 0; z-index: 10; background: #0f172a; padding: 18px 16px 14px;
    border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 700; }
  #backBtn {
    color: #e2e8f0; text-decoration: none; font-size: 20px; font-weight: 700;
    padding: 4px 10px; margin-right: 4px; border-radius: 8px;
  }
  #backBtn:active { background: #1e293b; }
  #refreshBtn, #historyBtn {
    background: #1e293b; color: #e2e8f0; border: none; border-radius: 20px; padding: 8px 14px;
    font-size: 13px; font-weight: 600;
  }
  #refreshBtn:active, #historyBtn:active { background: #334155; }
  #historyBtn.active { background: #334155; color: #93c5fd; }
  .hist-card {
    background: #1e293b; border-radius: 14px; padding: 14px 16px; margin-bottom: 10px;
    border: 1px solid #334155;
  }
  .hist-card .row1 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .hist-card h3 { font-size: 14px; margin: 0; font-weight: 700; color: #f1f5f9; flex: 1; }
  .hist-status { font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
  .hist-status.approved { background: #052e1a; color: #4ade80; }
  .hist-status.rejected { background: #450a0a; color: #f87171; }
  .hist-card .msg { font-size: 13px; color: #94a3b8; margin-top: 6px; }
  .hist-card .when { font-size: 11px; color: #64748b; margin-top: 6px; }
  main { padding: 14px; }
  .empty { text-align: center; color: #64748b; margin-top: 60px; font-size: 15px; }
  .card {
    background: #1e293b; border-radius: 14px; padding: 16px; margin-bottom: 14px;
    border: 1px solid #334155; animation: fadeIn .25s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .card .source {
    display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .04em; color: #93c5fd; background: #1e3a5f; padding: 3px 8px; border-radius: 6px; margin-bottom: 8px;
  }
  .card h2 { font-size: 16px; margin: 0 0 8px; font-weight: 700; color: #f8fafc; }
  .card .body {
    font-size: 14px; line-height: 1.5; color: #cbd5e1; white-space: pre-wrap;
    max-height: 200px; overflow-y: auto; margin-bottom: 14px; padding-right: 4px;
  }
  .btnrow { display: flex; gap: 10px; }
  .btn { flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; }
  .btn.approve { background: #16a34a; color: white; }
  .btn.approve:active { background: #15803d; }
  .btn.reject { background: #334155; color: #f1f5f9; }
  .btn.reject:active { background: #475569; }
  .btn:disabled { opacity: .5; }
  .result { margin-top: 10px; font-size: 13px; padding: 10px; border-radius: 8px; }
  .result.ok { background: #052e1a; color: #4ade80; }
  .result.err { background: #450a0a; color: #f87171; }
  .spinner {
    width: 16px; height: 16px; border: 2px solid #64748b; border-top-color: #e2e8f0;
    border-radius: 50%; display: inline-block; animation: spin .7s linear infinite; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast {
    position: fixed; bottom: 20px; left: 16px; right: 16px; background: #1e293b; color: #e2e8f0;
    padding: 12px 16px; border-radius: 10px; font-size: 13px; text-align: center; border: 1px solid #334155;
    opacity: 0; transition: opacity .3s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <div style="display:flex; align-items:center; gap:8px;">
    <a href="/" id="backBtn" aria-label="Back to hub">&larr;</a>
    <h1 id="pageTitle">Approvals</h1>
  </div>
  <div style="display:flex; gap:8px;">
    <button id="historyBtn">History</button>
    <button id="refreshBtn">Refresh</button>
  </div>
</header>
<main id="main">
  <div class="empty">Loading...</div>
</main>
<div class="toast" id="toast"></div>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function(){});
}

var mainEl = document.getElementById('main');
var toastEl = document.getElementById('toast');

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(function () { toastEl.classList.remove('show'); }, 3200);
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function linkify(html) {
  return html.replace(/(https?:\/\/[^\s<]+)/g, function (url) {
    return '<a href="' + url + '" target="_blank" rel="noopener" style="color:#93c5fd; word-break:break-all;">' + url + '</a>';
  });
}

function render(items) {
  if (!items.length) {
    mainEl.innerHTML = '<div class="empty">Nothing waiting on you right now.</div>';
    return;
  }
  mainEl.innerHTML = items.map(function (it) {
    return '' +
      '<div class="card" data-id="' + it.id + '">' +
        '<span class="source">' + escapeHtml(it.source || 'general') + '</span>' +
        '<h2>' + escapeHtml(it.title) + '</h2>' +
        '<div class="body">' + linkify(escapeHtml(it.body)) + '</div>' +
        '<div class="btnrow">' +
          '<button class="btn approve" data-action="approve">Approve</button>' +
          '<button class="btn reject" data-action="reject">Reject</button>' +
        '</div>' +
        '<div class="resultSlot"></div>' +
      '</div>';
  }).join('');
}

var viewMode = 'pending';

function formatWhen(iso) {
  if (!iso) return '';
  try {
    var d = new Date(iso);
    return d.toLocaleString('en-MY', { dateStyle: 'medium', timeStyle: 'short' });
  } catch (e) { return iso; }
}

function renderHistory(items) {
  if (!items.length) {
    mainEl.innerHTML = '<div class="empty">No decisions yet.</div>';
    return;
  }
  mainEl.innerHTML = items.map(function (it) {
    return '' +
      '<div class="hist-card">' +
        '<div class="row1">' +
          '<h3>' + escapeHtml(it.title) + '</h3>' +
          '<span class="hist-status ' + escapeHtml(it.status) + '">' + escapeHtml(it.status) + '</span>' +
        '</div>' +
        '<div class="msg">' + escapeHtml(it.result_message || '') + '</div>' +
        '<div class="when">' + escapeHtml(it.source || '') + ' \u00b7 ' + escapeHtml(formatWhen(it.decided_at)) + '</div>' +
      '</div>';
  }).join('');
}

function loadHistory() {
  mainEl.innerHTML = '<div class="empty">Loading...</div>';
  return fetch('/api/history', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (data) { renderHistory(data.items || []); })
    .catch(function () {
      mainEl.innerHTML = '<div class="empty">Could not reach the server. Tap Refresh to try again.</div>';
    });
}

function loadPending() {
  if (viewMode !== 'pending') return Promise.resolve();
  return fetch('/api/pending', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (data) { render(data.items || []); })
    .catch(function () {
      mainEl.innerHTML = '<div class="empty">Could not reach the server. Tap Refresh to try again.</div>';
    });
}

function loadCurrentView() {
  return viewMode === 'pending' ? loadPending() : loadHistory();
}

mainEl.addEventListener('click', function (e) {
  var btn = e.target.closest('button[data-action]');
  if (!btn) return;
  var card = btn.closest('.card');
  var id = card.getAttribute('data-id');
  var action = btn.getAttribute('data-action');
  var decision = action === 'approve' ? 'approve' : 'reject';
  var buttons = card.querySelectorAll('button');
  buttons.forEach(function (b) { b.disabled = true; });
  btn.innerHTML = '<span class="spinner"></span>';
  fetch('/api/decide', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: id, decision: decision, format: 'json' })
  })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var slot = card.querySelector('.resultSlot');
      var ok = !!data.success;
      slot.innerHTML = '<div class="result ' + (ok ? 'ok' : 'err') + '">' + escapeHtml(data.message || (ok ? 'Done.' : 'Something went wrong.')) + '</div>';
      showToast(ok ? 'Done' : 'Failed');
      setTimeout(function () {
        card.style.transition = 'opacity .3s';
        card.style.opacity = '0';
        setTimeout(function () { loadCurrentView(); }, 300);
      }, 900);
    })
    .catch(function () {
      var slot = card.querySelector('.resultSlot');
      slot.innerHTML = '<div class="result err">Network error — try again.</div>';
      buttons.forEach(function (b) { b.disabled = false; });
      btn.innerHTML = action === 'approve' ? 'Approve' : 'Reject';
    });
});

document.getElementById('historyBtn').addEventListener('click', function () {
  viewMode = viewMode === 'pending' ? 'history' : 'pending';
  document.getElementById('historyBtn').classList.toggle('active', viewMode === 'history');
  document.getElementById('pageTitle').textContent = viewMode === 'history' ? 'History' : 'Approvals';
  loadCurrentView();
});

document.getElementById('refreshBtn').addEventListener('click', loadCurrentView);

loadCurrentView();
setInterval(function () { if (viewMode === 'pending') loadCurrentView(); }, 25000);
</script>
</body>
</html>
